services:
  telemost-control-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemost-control-service
    restart: unless-stopped
    network_mode: host
    user: "1002:1002"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
