[project]
name = "telemost-control-service"
version = "0.1.0"
description = "Central control service for Telemost bot nodes"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.50.2,<0.51.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "caldav (>=3.2.1,<4.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "boto3 (>=1.40.0,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "control_service" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
control-service = "api_run:main"
